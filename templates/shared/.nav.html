{{define "nav"}}
{{- $login := or (.Req.Header.Get "X-Token-User-Name") (.Req.Header.Get "X-Token-Subject") "anonymous"}}
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="/">todoxt</a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Lists</a>
      <a href="/about">About</a>
      <span class="user-chip" title="Authenticated identity">
        <span aria-hidden="true">👤</span>
        <span>{{$login}}</span>
      </span>
    </nav>
  </div>
</header>
{{end}}
