<!DOCTYPE html>
<html lang="en">
<head>
  {{- $title := or (.Vars.Get "error_title") "Error"}}
  <title>{{$title}} — todoxt</title>
  {{template "/shared/.head.html" .}}
</head>
<body>
  {{template "nav" .}}
  <main class="site-main">
    <section class="hero">
      <h1>{{$title}}</h1>
      {{- $msg := .Vars.Get "error"}}
      <p>{{if $msg}}{{$msg}}{{else}}Something went wrong. Try again.{{end}}</p>
      <div class="cta-row">
        <a class="btn" href="/">Back to your lists</a>
      </div>
    </section>
  </main>
</body>
</html>
